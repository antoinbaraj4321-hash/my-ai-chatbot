
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #212121;
            color: white;
        }

        header {
            padding: 18px;
            text-align: center;
            background: #171717;
            border-bottom: 1px solid #333;
        }

        header h2 {
            margin: 0;
        }

        #chat {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            height: calc(100vh - 150px);
            overflow-y: auto;
        }

        .message {
            padding: 14px 18px;
            margin: 15px 0;
            border-radius: 15px;
            max-width: 85%;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #343434;
            margin-left: auto;
        }

        .ai {
            background: #292929;
            margin-right: auto;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px;
            background: #212121;
        }

        .input-box {
            max-width: 800px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 25px;
            border: 1px solid #555;
            background: #303030;
            color: white;
            outline: none;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: white;
            color: black;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }
    </style>
</head>

<body>

<header>
    <h2>🤖 My AI Chatbot</h2>
    <button onclick="clearChat()">Clear Chat</button>
</header>

<div id="chat">
    <div class="message ai">
        Hello! 👋 I am your AI assistant.
        Ask me anything!
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <input id="question"
               type="text"
               placeholder="Message your AI..."
               autocomplete="off">

        <button id="sendButton" onclick="sendMessage()">
            Send
        </button>
    </div>
</div>

<script>   
const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const button = document.getElementById("sendButton");

    async function sendMessage() {
        const question = input.value.trim();

        if (!question || button.disabled) return;

        addMessage(question, "user");

        input.value = "";
        button.disabled = true;

        const loading = addMessage("AI is thinking...", "ai");

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ question: question })
            });

            const data = await response.json();
            loading.textContent = data.answer;

        } catch (error) {
            loading.textContent = "Error! Please try again.";
        }

        button.disabled = false;
    }

async function loadHistory() {
    const response = await fetch("/history");
    const history = await response.json();

    chat.innerHTML = "";

    if (history.length === 0) {
        addMessage("Hello! 👋 I am your AI assistant. Ask me anything!", "ai");
        return;
    }

    history.forEach(message => {
        const type = message.role === "user" ? "user" : "ai";
        addMessage(message.content, type);
    });

    chat.scrollTop = chat.scrollHeight;
}

    async function clearChat() {
        await fetch("/clear", { method: "POST" });

        chat.innerHTML = `
            <div class="message ai">
                Hello! 👋 I am your AI assistant.
                Ask me anything!
            </div>
        `;
    }

    function addMessage(text, type) {
        const message = document.createElement("div");
        message.className = "message " + type;
        message.textContent = text;
        chat.appendChild(message);
        return message;
    }

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
    loadHistory();
</script>

</body>
</html>
